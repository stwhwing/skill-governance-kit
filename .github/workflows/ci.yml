name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The test suite runs against src/ via the pytest pythonpath setting,
      # so installing pytest alone keeps CI stable and dependency-free.
      - name: Install pytest
        run: python -m pip install --upgrade pip && python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
